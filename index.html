/* Estética de las presentaciones interactivas: fondo navy con rejilla de 48 px, tres tipografías, acentos verde/azul/ámbar/rojo/violeta/cian. */
:root{
  --bg0:#090E1A; --bg1:#0F1730; --tx:#EEF2FA; --tx2:#9AA7C4; --tx3:#7C88A6;
  --green:#3BE39C; --blue:#55A8FF; --amber:#FFB547; --red:#FF5D6C; --violet:#B48CFF; --cyan:#5EEAD4;
  --card:rgba(15,23,48,.78); --line:rgba(255,255,255,.12); --soft:rgba(255,255,255,.08);
  --sun:#FFB547; --moon:#CFC2FF; --cloudc:#8A9BBE; --cloud2:#626F92; --snow:#BCD8EE;
  --display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg0);-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--tx);
  font:400 15px/1.45 var(--body);
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(34px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(160deg,var(--bg0),var(--bg1));
}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* antetítulo: mono, mayúsculas, raya delante */
.kick{display:flex;align-items:center;gap:10px;font:600 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--kc,var(--cyan))}
.kick::before{content:"";flex:none;width:28px;height:3px;border-radius:2px;background:currentColor}
.kick.blue{--kc:var(--blue)} .kick.green{--kc:var(--green)} .kick.amber{--kc:var(--amber)} .kick.cyan{--kc:var(--cyan)}
h2.kick{margin:0 0 12px}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{margin:6px 0 0;font:700 2.2rem/1.05 var(--display);letter-spacing:-.02em}
.topr{display:flex;align-items:center;gap:8px;min-width:0}
.status{font:400 11px/1.3 var(--mono);color:var(--tx3);text-align:right;min-width:0}
.icon-btn{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--soft);display:grid;place-items:center;padding:0}
.icon-btn:hover{background:rgba(255,255,255,.14)}
.icon-btn svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.icon-btn.spin svg{animation:none}}

.places{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.places::-webkit-scrollbar{display:none}
.chipwrap{display:flex;flex:none;gap:4px}
.chip{flex:none;min-height:42px;padding:0 16px;border-radius:24px;border:1px solid var(--line);background:rgba(9,14,26,.88);color:var(--tx);font:400 13px/1 var(--mono);white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip:hover{background:rgba(255,255,255,.1)}
.chip svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.chip.on{background:var(--green);border-color:var(--green);color:#04120B;font-weight:600}
.chip.ghost{background:transparent;color:var(--tx2);border-style:dashed}
.chip-x{flex:none;width:42px;min-height:42px;border-radius:24px;border:1px solid var(--red);background:transparent;color:var(--red);font-size:1.25rem;line-height:1;padding:0}

.add{background:#05080F;border:1px solid var(--line);border-radius:14px;padding:14px}
.add label{display:block;font:400 11px/1.2 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx2);margin-bottom:8px}
.add input{width:100%;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--bg0);color:var(--tx);padding:0 12px;font:inherit}
.results{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
.results li{border-top:1px solid var(--line)}
.results li.muted{color:var(--tx2);padding:12px 2px}
.results button{width:100%;text-align:left;background:none;border:0;padding:12px 2px;min-height:46px;display:flex;flex-direction:column}
.results button span{color:var(--tx2);font-size:.8rem}

.notice{border:1px solid var(--amber);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:.88rem;background:rgba(255,181,71,.07)}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}

.now-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.place-name{margin-top:8px;font:700 1.35rem/1.15 var(--display);letter-spacing:-.01em;overflow-wrap:anywhere}
.place-detail{color:var(--tx2);font-size:.82rem;overflow-wrap:anywhere}
.now .ico.big{width:76px;height:76px;flex:none}
.temp{font:500 5rem/1 var(--display);letter-spacing:-.04em;margin-top:4px}
.cond{margin-top:6px;color:var(--tx2)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.stats div{min-width:0}
.stats dt{font:400 10.5px/1.2 var(--mono);color:var(--tx2);letter-spacing:.1em;text-transform:uppercase}
.stats dd{margin:3px 0 0;font:600 1rem/1.2 var(--body)}

.brief{display:flex;flex-direction:column;gap:3px}
.brief strong{font-weight:600}
.brief .rain{color:var(--blue)}

.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-inline:-4px;padding-inline:4px;scrollbar-width:thin;scrollbar-color:var(--soft) transparent}
.hour{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:10px}
.hour.now{background:var(--soft)}
.hour .h{font:400 11px/1.2 var(--mono);color:var(--tx2);white-space:nowrap}
.hour.now .h{color:var(--green);font-weight:600}
.hour .t{font:500 1rem/1 var(--display)}
.hour .pb{width:8px;height:34px;border-radius:4px;background:var(--soft);display:flex;align-items:flex-end;overflow:hidden}
.hour.now .pb{background:rgba(255,255,255,.12)}
.hour .pb i{display:block;width:100%;background:var(--blue)}
.hour .p{font:400 11px/1 var(--mono);color:var(--tx2)}
.hour .p.hi{color:var(--blue);font-weight:600}

.ico{width:32px;height:32px;display:block}
.ico .sun{fill:var(--sun)} .ico .ray{stroke:var(--sun);stroke-width:2.4;stroke-linecap:round}
.ico .moon{fill:var(--moon)} .ico .cl{fill:var(--cloudc)} .ico .cl2{fill:var(--cloud2)}
.ico .drop{stroke:var(--blue);stroke-width:2.6;stroke-linecap:round;fill:none}
.ico .flake{fill:var(--snow)} .ico .bolt{fill:var(--sun)}
.ico .fogl{stroke:var(--cloudc);stroke-width:2.8;stroke-linecap:round}

.day{display:grid;grid-template-columns:minmax(0,5.4rem) 30px 2.9rem minmax(0,1fr);align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:0}
.day .dn{min-width:0}
.day .dn b{display:block;font:600 .95rem/1.25 var(--body)}
.day .dn span{display:block;color:var(--tx2);font-size:.74rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .pp{font:400 11px/1.3 var(--mono);color:var(--tx2);text-align:right}
.day .pp b{display:block;font-weight:600;font-size:12px;color:var(--tx2)}
.day .pp b.hi{color:var(--blue)}
.range{display:grid;grid-template-columns:1.9rem minmax(0,1fr) 1.9rem;align-items:center;gap:5px;font:500 .95rem/1 var(--display)}
.range .lo{color:var(--tx2);text-align:right}
.rbar{position:relative;height:6px;border-radius:3px;background:var(--soft)}
.rbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--amber))}

.empty,.error{text-align:center;padding:30px 14px;color:var(--tx2)}
.error b{display:block;color:var(--red);margin-bottom:4px;font:700 1.05rem/1.2 var(--display)}
.error button,.empty button{margin-top:14px;min-height:46px;padding:0 22px;border-radius:24px;border:0;background:var(--green);color:#04120B;font-weight:600}
.foot{margin:2px 0 0;font:400 11px/1.4 var(--mono);color:var(--tx3);letter-spacing:.04em}
.foot a{color:inherit}

/* barra de progreso inferior: avance del día en el lugar mostrado */
#dayprog{position:fixed;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.06);z-index:50;pointer-events:none}
#dayprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--green))}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="kick cyan">Previsión</div>
      <h1>Tiempo</h1>
    </div>
    <div class="topr">
      <span id="status" class="status" aria-live="polite"></span>
      <button id="refresh" class="icon-btn" type="button" aria-label="Actualizar">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <nav id="places" class="places" aria-label="Lugares"></nav>

  <section id="addpanel" class="add" hidden>
    <label for="q">Buscar ciudad o pueblo</label>
    <input id="q" type="search" autocomplete="off" autocapitalize="words" placeholder="Por ejemplo: Ronda">
    <ul id="results" class="results"></ul>
  </section>

  <div id="notice" class="notice" role="status" hidden></div>
  <main id="main"></main>

  <p class="foot">TIEMPO · Previsión de <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0)</p>
</div>
<div id="dayprog" title="Progreso del día"><i></i></div>

<script>
(function(){
'use strict';

var LS_KEY='tiempo.v1';
var CACHE_PREFIX='tiempo.cache.';
var FRESH_MS=10*60*1000;
var STALE_MS=20*60*1000;
var FORECAST_URL='https://api.open-meteo.com/v1/forecast';
var GEO_URL='https://geocoding-api.open-meteo.com/v1/search';
var DEFAULT_PLACES=[{id:'p-malaga',name:'Málaga',detail:'Andalucía, España',lat:36.7213,lon:-4.4214}];

var state={places:[],sel:'gps'};
var editing=false;
var seq=0;
var loadedAt=0;

function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- almacenamiento ---------- */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function loadState(){
  try{
    var s=JSON.parse(lsGet(LS_KEY));
    if(s&&Array.isArray(s.places)&&typeof s.sel==='string'){state=s;return}
  }catch(e){}
  state={places:DEFAULT_PLACES.slice(),sel:'gps'};
}
function saveState(){lsSet(LS_KEY,JSON.stringify(state))}
function readCache(key){try{return JSON.parse(lsGet(CACHE_PREFIX+key))}catch(e){return null}}
function writeCache(key,obj){lsSet(CACHE_PREFIX+key,JSON.stringify(obj))}

/* ---------- códigos WMO ---------- */
function wx(code,isDay){
  var n=isDay===0;
  switch(code){
    case 0:return {t:n?'Despejado':'Soleado',k:n?'moon':'sun'};
    case 1:return {t:'Casi despejado',k:n?'partnight':'part'};
    case 2:return {t:'Parcialmente nublado',k:n?'partnight':'part'};
    case 3:return {t:'Nublado',k:'cloud'};
    case 45:case 48:return {t:'Niebla',k:'fog'};
    case 51:case 53:case 55:return {t:'Llovizna',k:'drizzle'};
    case 56:case 57:return {t:'Llovizna helada',k:'drizzle'};
    case 61:return {t:'Lluvia débil',k:'rain'};
    case 63:return {t:'Lluvia',k:'rain'};
    case 65:return {t:'Lluvia fuerte',k:'rain'};
    case 66:case 67:return {t:'Lluvia helada',k:'rain'};
    case 71:case 73:case 75:return {t:'Nieve',k:'snow'};
    case 77:return {t:'Granizo fino',k:'snow'};
    case 80:return {t:'Chubascos débiles',k:'rain'};
    case 81:return {t:'Chubascos',k:'rain'};
    case 82:return {t:'Chubascos fuertes',k:'rain'};
    case 85:case 86:return {t:'Chubascos de nieve',k:'snow'};
    case 95:return {t:'Tormenta',k:'storm'};
    case 96:case 99:return {t:'Tormenta con granizo',k:'storm'};
    default:return {t:'Variable',k:'cloud'};
  }
}

/* ---------- iconos ---------- */
var CLOUD='M8 26h17a6 6 0 0 0 .9-11.9A8 8 0 0 0 10.6 16.2 5 5 0 0 0 8 26z';
function sunSvg(cx,cy,r){
  var s='<circle class="sun" cx="'+cx+'" cy="'+cy+'" r="'+r+'"/>';
  for(var i=0;i<8;i++){
    var a=i*Math.PI/4,c=Math.cos(a),d=Math.sin(a);
    s+='<line class="ray" x1="'+(cx+c*(r+3)).toFixed(1)+'" y1="'+(cy+d*(r+3)).toFixed(1)+'" x2="'+(cx+c*(r+6)).toFixed(1)+'" y2="'+(cy+d*(r+6)).toFixed(1)+'"/>';
  }
  return s;
}
var MOON='<path class="moon" d="M30 8a15 15 0 1 0 10 26A12 12 0 0 1 30 8z"/>';
function ico(k,cls){
  var b='';
  switch(k){
    case 'sun':b=sunSvg(24,24,9);break;
    case 'moon':b=MOON;break;
    case 'part':b=sunSvg(17,16,7)+'<path class="cl" transform="translate(8 12) scale(1.2)" d="'+CLOUD+'"/>';break;
    case 'partnight':b='<g transform="translate(-6 -4) scale(.8)">'+MOON+'</g><path class="cl" transform="translate(8 12) scale(1.2)" d="'+CLOUD+'"/>';break;
    case 'cloud':b='<path class="cl" transform="translate(1 6) scale(1.4)" d="'+CLOUD+'"/>';break;
    case 'fog':b='<path class="cl" transform="translate(4 0) scale(1.2)" d="'+CLOUD+'"/><line class="fogl" x1="10" y1="36" x2="38" y2="36"/><line class="fogl" x1="14" y1="42" x2="34" y2="42"/>';break;
    case 'drizzle':b='<path class="cl2" transform="translate(4 2) scale(1.2)" d="'+CLOUD+'"/><path class="drop" d="M17 37l-1 3M25 37l-1 3M33 37l-1 3"/>';break;
    case 'rain':b='<path class="cl2" transform="translate(4 2) scale(1.2)" d="'+CLOUD+'"/><path class="drop" d="M17 36l-2 7M25 36l-2 7M33 36l-2 7"/>';break;
    case 'snow':b='<path class="cl2" transform="translate(4 2) scale(1.2)" d="'+CLOUD+'"/><circle class="flake" cx="16" cy="39" r="2.4"/><circle class="flake" cx="25" cy="43" r="2.4"/><circle class="flake" cx="34" cy="39" r="2.4"/>';break;
    case 'storm':b='<path class="cl2" transform="translate(4 0) scale(1.2)" d="'+CLOUD+'"/><path class="bolt" d="M26 28l-7 10h5l-3 8 10-12h-6l3-6z"/>';break;
    default:b='<path class="cl" transform="translate(1 6) scale(1.4)" d="'+CLOUD+'"/>';
  }
  return '<svg class="ico'+(cls?' '+cls:'')+'" viewBox="0 0 48 48" aria-hidden="true">'+b+'</svg>';
}
var GPS_ICON='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';

/* ---------- formato ---------- */
function T(n){return Math.round(n)+'°'}
function pct(n){return Math.round(n||0)}
function mm(x){
  if(!x||x<0.05)return '0 mm';
  if(x<0.1)return '<0,1 mm';
  return x.toFixed(1).replace('.',',')+' mm';
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function dayDate(s){return new Date(s.slice(0,10)+'T12:00:00')}
function weekdayLong(s){return cap(dayDate(s).toLocaleDateString('es-ES',{weekday:'long'}))}
function weekdayShort(s){return dayDate(s).toLocaleDateString('es-ES',{weekday:'short'}).replace('.','')}
function dayNum(s){return dayDate(s).getDate()}
function hhmm(s){return s.slice(11,16)}

/* ---------- red ---------- */
function withTimeout(url,ms){
  var ctl=new AbortController();
  var t=setTimeout(function(){ctl.abort()},ms);
  return fetch(url,{signal:ctl.signal}).then(function(r){clearTimeout(t);return r},function(e){clearTimeout(t);throw e});
}
function forecastUrl(p){
  var q=new URLSearchParams({
    latitude:p.lat.toFixed(4),
    longitude:p.lon.toFixed(4),
    current:'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,is_day',
    hourly:'temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m,is_day',
    daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset,uv_index_max',
    timezone:'auto',
    forecast_days:'7',
    wind_speed_unit:'kmh'
  });
  return FORECAST_URL+'?'+q.toString();
}
function fetchForecast(p){
  return withTimeout(forecastUrl(p),15000).then(function(r){
    if(!r.ok)throw new Error('el servidor respondió '+r.status);
    return r.json();
  }).then(function(j){
    if(!j||!j.current||!j.hourly||!j.daily)throw new Error('respuesta incompleta');
    return j;
  });
}
function getGps(){
  return new Promise(function(res,rej){
    if(!navigator.geolocation)return rej(new Error('este navegador no ofrece geolocalización'));
    navigator.geolocation.getCurrentPosition(function(p){
      res({id:'gps',name:'Mi posición',detail:p.coords.latitude.toFixed(3)+', '+p.coords.longitude.toFixed(3),lat:p.coords.latitude,lon:p.coords.longitude});
    },function(e){
      rej(new Error(e&&e.code===1?'permiso de ubicación denegado':e&&e.code===3?'tiempo de espera agotado':'posición no disponible'));
    },{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
  });
}

/* ---------- interfaz: lugares ---------- */
function renderTabs(){
  var h='<button type="button" class="chip'+(state.sel==='gps'?' on':'')+'" data-id="gps">'+GPS_ICON+'Mi posición</button>';
  state.places.forEach(function(p){
    h+='<span class="chipwrap"><button type="button" class="chip'+(state.sel===p.id?' on':'')+'" data-id="'+esc(p.id)+'">'+esc(p.name)+'</button>'
      +(editing?'<button type="button" class="chip-x" data-del="'+esc(p.id)+'" aria-label="Quitar '+esc(p.name)+'">×</button>':'')+'</span>';
  });
  h+='<button type="button" class="chip ghost" data-act="add">+ Añadir</button>';
  if(state.places.length)h+='<button type="button" class="chip ghost" data-act="edit">'+(editing?'Hecho':'Quitar')+'</button>';
  $('#places').innerHTML=h;
}
function setNotice(msg){
  var n=$('#notice');
  if(msg){n.textContent=msg;n.hidden=false}else{n.hidden=true;n.textContent=''}
}
function setStatus(msg){$('#status').textContent=msg||''}

/* ---------- interfaz: contenido ---------- */
function brief(hr,idx,n){
  var maxP=0,first=-1,sum=0,tmin=Infinity,tmax=-Infinity,end=Math.min(idx+n,hr.time.length);
  for(var i=idx;i<end;i++){
    var p=hr.precipitation_probability[i]||0;
    if(p>maxP)maxP=p;
    if(first<0&&p>=50)first=i;
    sum+=hr.precipitation[i]||0;
    if(hr.temperature_2m[i]<tmin)tmin=hr.temperature_2m[i];
    if(hr.temperature_2m[i]>tmax)tmax=hr.temperature_2m[i];
  }
  var rain;
  if(first>=0){
    var same=hr.time[first].slice(0,10)===hr.time[idx].slice(0,10);
    rain='<strong class="rain">Lluvia probable '+(same?'desde las ':'desde mañana a las ')+hhmm(hr.time[first])+'</strong> (hasta '+maxP+' %, '+mm(sum)+' en 24 h).';
  }else if(maxP>=30||sum>=0.3){
    rain='<strong>Posibles chubascos aislados</strong> (hasta '+maxP+' %, '+mm(sum)+' en 24 h).';
  }else{
    rain='<strong>Sin lluvia prevista</strong> en las próximas 24 h (máx. '+maxP+' %).';
  }
  return '<div>'+rain+'</div><div>Temperatura entre '+T(tmin)+' y '+T(tmax)+'.</div>';
}

function render(place,c,opt){
  opt=opt||{};
  var d=c.data,cu=d.current,hr=d.hourly,dy=d.daily;
  var w=wx(cu.weather_code,cu.is_day);
  var idx=hr.time.findIndex(function(t){return t.slice(0,13)===cu.time.slice(0,13)});
  if(idx<0)idx=0;

  var h='';
  h+='<section class="card now">'
    +'<div class="now-top"><div><div class="kick cyan">Ahora</div><div class="place-name">'+esc(place.name)+'</div><div class="place-detail">'+esc(place.detail||'')+'</div></div>'+ico(w.k,'big')+'</div>'
    +'<div class="temp">'+Math.round(cu.temperature_2m)+'°</div>'
    +'<div class="cond">'+esc(w.t)+' · sensación '+T(cu.apparent_temperature)+'</div>'
    +'<dl class="stats">'
    +'<div><dt>Mín / Máx</dt><dd>'+T(dy.temperature_2m_min[0])+' / '+T(dy.temperature_2m_max[0])+'</dd></div>'
    +'<div><dt>Viento</dt><dd>'+Math.round(cu.wind_speed_10m)+' km/h</dd></div>'
    +'<div><dt>Humedad</dt><dd>'+Math.round(cu.relative_humidity_2m)+' %</dd></div>'
    +'<div><dt>Amanecer</dt><dd>'+hhmm(dy.sunrise[0])+'</dd></div>'
    +'<div><dt>Ocaso</dt><dd>'+hhmm(dy.sunset[0])+'</dd></div>'
    +'<div><dt>UV máx.</dt><dd>'+Math.round(dy.uv_index_max[0])+'</dd></div>'
    +'</dl></section>';

  h+='<section class="card brief"><h2 class="kick amber">Resumen 24 h</h2>'+brief(hr,idx,24)+'</section>';

  h+='<section class="card"><h2 class="kick blue">Próximas 24 horas</h2><div class="hours">';
  var end=Math.min(idx+24,hr.time.length);
  for(var i=idx;i<end;i++){
    var hw=wx(hr.weather_code[i],hr.is_day[i]);
    var p=pct(hr.precipitation_probability[i]);
    var hh=hr.time[i].slice(11,13);
    var label=i===idx?'Ahora':(hh==='00'?weekdayShort(hr.time[i])+' 0h':parseInt(hh,10)+' h');
    h+='<div class="hour'+(i===idx?' now':'')+'">'
      +'<span class="h">'+esc(label)+'</span>'
      +ico(hw.k)
      +'<span class="t">'+T(hr.temperature_2m[i])+'</span>'
      +'<span class="pb" title="Probabilidad de lluvia"><i style="height:'+p+'%"></i></span>'
      +'<span class="p'+(p>=40?' hi':'')+'">'+p+'%</span>'
      +'</div>';
  }
  h+='</div></section>';

  var gmin=Math.min.apply(null,dy.temperature_2m_min),gmax=Math.max.apply(null,dy.temperature_2m_max),span=(gmax-gmin)||1;
  h+='<section class="card"><h2 class="kick green">Próximos días</h2>';
  for(var k=0;k<dy.time.length;k++){
    var dw=wx(dy.weather_code[k],1);
    var name=k===0?'Hoy':k===1?'Mañana':weekdayLong(dy.time[k]);
    var sub=k<2?weekdayShort(dy.time[k])+' '+dayNum(dy.time[k])+' · '+dw.t:dayNum(dy.time[k])+' · '+dw.t;
    var left=(dy.temperature_2m_min[k]-gmin)/span*100;
    var width=Math.max(6,(dy.temperature_2m_max[k]-dy.temperature_2m_min[k])/span*100);
    if(left+width>100)left=100-width;
    var pp=pct(dy.precipitation_probability_max[k]);
    h+='<div class="day">'
      +'<div class="dn"><b>'+esc(name)+'</b><span>'+esc(sub)+'</span></div>'
      +ico(dw.k)
      +'<div class="pp"><b'+(pp>=40?' class="hi"':'')+'>'+pp+'%</b>'+mm(dy.precipitation_sum[k])+'</div>'
      +'<div class="range"><span class="lo">'+T(dy.temperature_2m_min[k])+'</span><span class="rbar"><i style="left:'+left.toFixed(1)+'%;width:'+width.toFixed(1)+'%"></i></span><span>'+T(dy.temperature_2m_max[k])+'</span></div>'
      +'</div>';
  }
  h+='</section>';

  $('#main').innerHTML=h;

  var hm=cu.time.slice(11,16).split(':');
  var frac=(parseInt(hm[0],10)+parseInt(hm[1],10)/60)/24;
  var dp=$('#dayprog');
  dp.firstElementChild.style.width=(frac*100).toFixed(1)+'%';
  dp.title='Progreso del día en '+place.name+' ('+cu.time.slice(11,16)+')';

  var hora=new Date(c.t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  setStatus(opt.stale?'Guardado a las '+hora:'Actualizado '+hora);
}

function showError(msg){
  $('#main').innerHTML='<section class="card error"><b>No se pudo cargar la previsión</b>'+esc(msg)+'<br><button type="button" data-act="retry">Reintentar</button></section>';
  setStatus('');
}
function showEmpty(){
  $('#main').innerHTML='<section class="card empty">Añade un lugar para ver su previsión.<br><button type="button" data-act="add">Añadir lugar</button></section>';
  setStatus('');
}

/* ---------- flujo principal ---------- */
function show(id,force){
  var my=++seq;
  state.sel=id;saveState();renderTabs();setNotice('');
  var btn=$('#refresh');btn.classList.add('spin');
  function done(){if(my===seq)btn.classList.remove('spin')}

  var placeP;
  if(id==='gps'){
    setStatus('Buscando posición…');
    placeP=getGps().then(function(p){
      lsSet('tiempo.lastgps',JSON.stringify({lat:p.lat,lon:p.lon}));
      return p;
    }).catch(function(e){
      var last=null;try{last=JSON.parse(lsGet('tiempo.lastgps'))}catch(x){}
      if(last&&typeof last.lat==='number'){
        if(my===seq)setNotice('No puedo obtener tu posición ('+e.message+'). Uso la última conocida.');
        return {id:'gps',name:'Mi posición',detail:'Última posición conocida',lat:last.lat,lon:last.lon};
      }
      var fb=state.places[0];
      if(fb){
        if(my===seq)setNotice('No puedo obtener tu posición ('+e.message+'). Muestro '+fb.name+'.');
        return fb;
      }
      throw e;
    });
  }else{
    var found=state.places.filter(function(p){return p.id===id})[0]||state.places[0];
    placeP=found?Promise.resolve(found):Promise.reject(new Error('sin lugares'));
  }

  placeP.then(function(place){
    if(my!==seq)return;
    var key=place.lat.toFixed(2)+','+place.lon.toFixed(2);
    var cache=readCache(key);
    var age=cache?Date.now()-cache.t:Infinity;
    if(cache&&!force&&age<FRESH_MS){render(place,cache);loadedAt=cache.t;done();return}
    if(cache)render(place,cache,{stale:true});
    else{$('#main').innerHTML='<section class="card empty">Cargando previsión…</section>'}
    setStatus('Actualizando…');
    return fetchForecast(place).then(function(data){
      var obj={t:Date.now(),data:data};
      writeCache(key,obj);
      if(my!==seq)return;
      loadedAt=obj.t;
      render(place,obj);
      done();
    }).catch(function(e){
      if(my!==seq)return;
      done();
      if(cache){render(place,cache,{stale:true});setNotice('Sin conexión con el servidor del tiempo ('+e.message+'). Muestro los datos guardados.')}
      else showError(e.message);
    });
  }).catch(function(e){
    if(my!==seq)return;
    done();
    if(!state.places.length&&id!=='gps')showEmpty();
    else showError(e.message);
  });
}

/* ---------- eventos ---------- */
$('#places').addEventListener('click',function(ev){
  var del=ev.target.closest('[data-del]');
  if(del){
    var id=del.getAttribute('data-del');
    state.places=state.places.filter(function(p){return p.id!==id});
    var wasSel=state.sel===id;
    if(!state.places.length)editing=false;
    saveState();
    if(wasSel)show(state.places.length?state.places[0].id:'gps');else renderTabs();
    return;
  }
  var act=ev.target.closest('[data-act]');
  if(act){
    var a=act.getAttribute('data-act');
    if(a==='add'){togglePanel()}
    if(a==='edit'){editing=!editing;renderTabs()}
    return;
  }
  var chip=ev.target.closest('[data-id]');
  if(chip){show(chip.getAttribute('data-id'),false)}
});
$('#main').addEventListener('click',function(ev){
  var act=ev.target.closest('[data-act]');
  if(!act)return;
  if(act.getAttribute('data-act')==='retry')show(state.sel,true);
  if(act.getAttribute('data-act')==='add')togglePanel(true);
});
$('#refresh').addEventListener('click',function(){show(state.sel,true)});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&loadedAt&&Date.now()-loadedAt>STALE_MS)show(state.sel,false);
});

/* ---------- buscar lugares ---------- */
var lastResults=[],searchSeq=0,searchTimer=null;
function togglePanel(forceOpen){
  var p=$('#addpanel');
  p.hidden=forceOpen?false:!p.hidden;
  if(!p.hidden){$('#q').value='';$('#results').innerHTML='';$('#q').focus()}
}
function search(v){
  var my=++searchSeq,res=$('#results');
  res.innerHTML='<li class="muted">Buscando…</li>';
  withTimeout(GEO_URL+'?name='+encodeURIComponent(v)+'&count=6&language=es&format=json',10000)
    .then(function(r){if(!r.ok)throw new Error('error '+r.status);return r.json()})
    .then(function(j){
      if(my!==searchSeq)return;
      var L=j.results||[];
      lastResults=L;
      if(!L.length){res.innerHTML='<li class="muted">Sin resultados para «'+esc(v)+'».</li>';return}
      res.innerHTML=L.map(function(x,i){
        return '<li><button type="button" data-i="'+i+'">'+esc(x.name)+'<span>'+esc([x.admin2,x.admin1,x.country].filter(Boolean).join(', '))+'</span></button></li>';
      }).join('');
    })
    .catch(function(){if(my===searchSeq)res.innerHTML='<li class="muted">No se pudo buscar. Revisa la conexión.</li>'});
}
$('#q').addEventListener('input',function(){
  clearTimeout(searchTimer);
  var v=this.value.trim();
  if(v.length<2){searchSeq++;$('#results').innerHTML='';return}
  searchTimer=setTimeout(function(){search(v)},350);
});
$('#results').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-i]');
  if(!b)return;
  var x=lastResults[parseInt(b.getAttribute('data-i'),10)];
  if(!x)return;
  var dup=state.places.filter(function(p){return Math.abs(p.lat-x.latitude)<0.02&&Math.abs(p.lon-x.longitude)<0.02})[0];
  var place=dup||{
    id:'p-'+Date.now().toString(36),
    name:x.name,
    detail:[x.admin1,x.country].filter(Boolean).join(', '),
    lat:x.latitude,lon:x.longitude
  };
  if(!dup){state.places.push(place);saveState()}
  $('#addpanel').hidden=true;
  show(place.id,false);
});

/* ---------- arranque ---------- */
loadState();
if(state.sel!=='gps'&&!state.places.some(function(p){return p.id===state.sel}))state.sel='gps';
renderTabs();
show(state.sel,false);
})();
</script>
</body>
</html>
